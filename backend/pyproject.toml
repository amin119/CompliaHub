[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "cohere>=5.19.0",
    "fastapi>=0.140.13",
    "google-genai>=2.16.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "minio>=7.2.20",
    "neo4j>=6.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.0",
    "voyageai>=0.3.6",
]

# Split so each of the three Celery worker images (see docker-compose.yml)
# only installs what its own tasks need — `docling` and the graph libs pull
# in a multi-GB torch/opencv stack, and bundling them into every worker image
# meant any code change forced a full rebuild of that same multi-GB layer.
# The plain "vector" worker needs neither extra: voyageai/qdrant-client are
# already in base `dependencies` above.
#
# `google-genai` moved to base (Phase 5): the query classifier and agent
# loop run in the host FastAPI process (`/query`), not a Celery worker, so
# it's no longer worker-graph-exclusive — it now has two independent
# consumers (host classifier, worker-graph extraction/summarization).
[project.optional-dependencies]
ingestion = ["docling>=2.116.0"]
graph = ["leidenalg>=0.12.0", "python-igraph>=1.0.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # pyflakes + pycodestyle + import sorting

[tool.pytest.ini_options]
pythonpath = ["."] # so `import app.main` resolves when running `uv run pytest`
