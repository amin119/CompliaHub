[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "celery>=5.6.3",
    "cohere>=5.19.0",
    "docling>=2.116.0",
    "fastapi>=0.140.13",
    "minio>=7.2.20",
    "neo4j>=6.2.0",
    "openai>=2.52.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.0",
    "voyageai>=0.3.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"] # pyflakes + pycodestyle + import sorting

[tool.pytest.ini_options]
pythonpath = ["."] # so `import app.main` resolves when running `uv run pytest`
