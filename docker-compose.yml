
# Local dev data stack for ComplianceGraph.
# Every service here maps to a box in the architecture diagram in the roadmap:
# Postgres (metadata/jobs), Redis (cache/queue), Neo4j (graph), Qdrant (vectors),
# MinIO (raw document storage). None of this touches the cloud — it's all
# containers on your machine, disposable and rebuildable with `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT}:7474" # browser UI
      - "${NEO4J_BOLT_PORT}:7687" # bolt protocol (driver connections)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_HTTP_PORT}:6333" # REST API
      - "${QDRANT_GRPC_PORT}:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant's image has neither wget nor curl (confirmed by
      # inspection) — /dev/tcp is a bash builtin, not a `sh`/dash one, so
      # this must run under bash explicitly, not CMD-SHELL's default /bin/sh.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT}:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Three role-scoped Celery workers, replacing one do-everything worker.
  # Each builds from the same backend/Dockerfile but with a different EXTRA
  # build-arg, so each image only carries the dependencies its own tasks
  # need (see backend/pyproject.toml's [project.optional-dependencies]) —
  # e.g. worker-vector never installs Docling or the graph libs, so editing
  # extraction.py no longer forces a rebuild of that multi-GB image. All run
  # on Linux inside the container regardless of the Windows host — Celery's
  # default worker pool needs os.fork(), which native Windows doesn't have.
  #
  # Networking note: these containers reach the other services by their
  # *service name* (postgres, redis, minio) over the compose network, not
  # `localhost`. That's different from backend/.env, which the FastAPI dev
  # server (running natively on the Windows host, outside this network) uses
  # with `localhost` + published ports. Same services, two different
  # vantage points.

  worker-ingestion:
    build:
      context: ./backend
      args:
        EXTRA: ingestion
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "ingestion,scanner", "-I", "app.tasks.ingestion,app.tasks.scan"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-vector:
    build:
      context: ./backend
    # Platform Phase 7: "eval" added alongside "vector" — the eval harness's
    # task (app.tasks.evaluation) runs the exact real `/query` pipeline via
    # query_orchestration.run_query, which is why this previously
    # embedding-only worker now also needs Cohere/Gemini/Neo4j below, not
    # just Voyage/Qdrant. Its own queue name, not folded into "vector", so a
    # long eval run (many minutes) can't block real user-facing document-
    # embedding tasks on this same worker process.
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "vector,eval", "-I", "app.tasks.embedding,app.tasks.evaluation"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-law-2}
      COHERE_API_KEY: ${COHERE_API_KEY}
      COHERE_RERANK_MODEL: ${COHERE_RERANK_MODEL:-rerank-v3.5}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3.1-flash-lite}
      GEMINI_ANSWER_MODEL: ${GEMINI_ANSWER_MODEL:-gemini-3.1-flash-lite}
      GEMINI_EVAL_MODEL: ${GEMINI_EVAL_MODEL:-gemini-3.1-flash-lite}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  worker-graph:
    build:
      context: ./backend
      args:
        EXTRA: graph
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "graph", "-I", "app.tasks.extraction,app.tasks.community_detection"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Entity resolution's embedding-similarity stage calls Voyage too, so
      # this worker needs the same key as worker-vector even though its main
      # job is graph extraction.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-law-2}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  minio_data:
